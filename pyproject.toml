[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-brief"
version = "0.1.0"
description = "A deterministic, privacy-conscious daily brief for Canvas, Notion, Calendar, and Telegram."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "html2text>=2024.2.26",
  "icalendar>=6,<7",
  "jsonschema>=4.23,<5",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "rapidfuzz>=3.10,<4",
  "recurring-ical-events>=3.4,<4",
  "requests>=2.32,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "responses>=0.25,<1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["daily_brief"]

